CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=8
CONFIG_ZMK_RUNTIME_COMBO_MAX_POSITIONS_PER_COMBO=16
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ASSERT=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_ARM_MPU=y
CONFIG_MPU_STACK_GUARD=y
# Selected Zephyr excludes STACK_SENTINEL while MPU_STACK_GUARD is enabled.
CONFIG_STACK_SENTINEL=n
CONFIG_DEBUG_INFO=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
